[package]
name = "control-protocol"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "write-golden-vectors"
path = "src/bin/write_golden_vectors.rs"
required-features = ["std"]

[features]
default = []
std = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1.0.151", optional = true }

[dev-dependencies]
serde_json = "1.0.142"

[lints]
workspace = true
