[project]
name = "celerity-home"
version = "0.1.0"
description = "Celerity thermal-model training and ONNX tooling"
requires-python = ">=3.15,<3.16"
dependencies = [
  "celerity-proto",
  "numpy>=2.3,<3",
  "onnx>=1.18,<2",
  "onnxscript>=0.5,<1",
  "pyarrow>=25,<26",
  "torch>=2.8,<3",
]

[dependency-groups]
dev = [
  "mypy>=2.4,<3",
  "pyyaml>=6,<7",
  "pytest>=9.1.1,<10",
  "ruff>=0.17.1,<0.18",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
celerity-proto = { path = "../../gen/python" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/celerity_home"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.13"
files = ["src/celerity_home"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
