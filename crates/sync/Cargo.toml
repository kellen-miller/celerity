[package]
name = "sync"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
celerity-proto = { path = "../../gen/rust/proto" }
celerity-sql = { path = "../../gen/rust/sql" }
prost = "0.14.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }
toml = "1.1.4"
tonic = { version = "0.14.6", features = ["tls-native-roots", "tls-aws-lc"] }
zip = { version = "7.2.0", default-features = false }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

[dev-dependencies]
control-core = { path = "../control-core" }
hex = "0.4.3"
http-body = "1"
tempfile = "3.27.0"
tokio-stream = { version = "0.1", features = ["net"] }
tonic-health = "0.14.6"

[[bin]]
name = "celerity-sync"
path = "src/main.rs"

[lints]
workspace = true
