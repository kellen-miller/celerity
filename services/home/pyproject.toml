[project]
name = "celerity-home"
version = "0.1.0"
description = "Celerity Run admission, training, and model lifecycle"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.3,<3",
  "onnx>=1.18,<2",
  "onnxscript>=0.5,<1",
  "pyarrow>=21,<24",
  "protobuf>=7.36.2,<8",
  "torch>=2.8,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=2.4,<3",
  "pyyaml>=6,<7",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.10,<0.17",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celerity_home", "src/celerity"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/celerity"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.13"
files = ["src/celerity_home"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
