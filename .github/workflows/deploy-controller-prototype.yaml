name: Deploy controller prototype

on:
  push:
    branches: ['feat/controller-conformance-prototype']
    paths:
      - 'prototypes/controller-conformance-web/**'
      - '.github/workflows/deploy-controller-prototype.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototypes/controller-conformance-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: prototypes/controller-conformance-web

      - name: Check Svelte application
        run: npm run check
        working-directory: prototypes/controller-conformance-web

      - name: Build Svelte application
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
        working-directory: prototypes/controller-conformance-web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: prototypes/controller-conformance-web/build

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
