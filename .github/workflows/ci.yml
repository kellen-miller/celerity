name: CI

on:
  pull_request:
permissions:
  contents: read

jobs:
  prerelease:
    name: Prerelease generated contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-on-failure: true
          cache-key: prerelease-protos
          rustflags: ""
      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          node-version: '26'
          working-directory: crates/vehicle-ui/web

      - name: Check committed protobuf bindings
        run: ./scripts/check-protos

  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-on-failure: true
          cache-key: portable
          rustflags: ""
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: services/home/uv.lock
          cache-suffix: ${{ matrix.os }}
      - name: Set up Node project
        uses: kellen-miller/ci/.github/actions/setup-node@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          node-version: '26'
          working-directory: crates/vehicle-ui/web

      - name: Set up Playwright
        uses: kellen-miller/ci/.github/actions/playwright-setup@d1c91763535a5866b55282018f301d921b22bcd5
        with:
          working-directory: crates/vehicle-ui/web
          browsers: chromium
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Set up virtual CAN on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan-powertrain type vcan
          sudo ip link add dev vcan-controller type vcan
          sudo ip link set up vcan-powertrain
          sudo ip link set up vcan-controller
      - run: ./scripts/check-rust --portable
      - run: ./scripts/check-python
      - run: ./scripts/check-e2e
      - run: ./scripts/check-ui
      - run: ./scripts/check-artifacts

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts
      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: services/home/Dockerfile
      - name: Check source file lengths
        run: ./scripts/check-file-length

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-on-failure: true
          cache-key: linux-full
          rustflags: ""
      - name: Install cross linker and vcan
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan-powertrain type vcan
          sudo ip link add dev vcan-controller type vcan
          sudo ip link set up vcan-powertrain
          sudo ip link set up vcan-controller
      - run: ./scripts/check-linux
