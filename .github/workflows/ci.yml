name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prerelease:
    name: Prerelease generated contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache-on-failure: true
          cache-key: prerelease-protos
          rustflags: ""
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: crates/vehicle-ui/web/package-lock.json
      - name: Install UI dependencies
        run: npm ci
        working-directory: crates/vehicle-ui/web
      - name: Check committed protobuf bindings
        run: ./scripts/check-protos

  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache-on-failure: true
          cache-key: portable
          rustflags: ""
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: services/home/uv.lock
          cache-suffix: ${{ matrix.os }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: crates/vehicle-ui/web/package-lock.json
      - name: Install UI dependencies
        run: npm ci
        working-directory: crates/vehicle-ui/web
      - name: Install Chromium on macOS
        if: runner.os == 'macOS'
        run: npx playwright install chromium
        working-directory: crates/vehicle-ui/web
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: crates/vehicle-ui/web
      - uses: Azure/setup-helm@v5.0.1
        with:
          version: v4.2.3
      - name: Set up virtual CAN on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan-powertrain type vcan
          sudo ip link add dev vcan-controller type vcan
          sudo ip link set up vcan-powertrain
          sudo ip link set up vcan-controller
      - run: ./scripts/check-rust --portable
      - run: ./scripts/check-python
      - run: ./scripts/check-e2e
      - run: ./scripts/check-ui
      - run: ./scripts/check-artifacts

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
      - name: actionlint
        uses: raven-actions/actionlint@v2
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: services/home/Dockerfile
      - name: Check source file lengths
        run: ./scripts/check-file-length

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache-on-failure: true
          cache-key: linux-full
          rustflags: ""
      - name: Install cross linker and vcan
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan-powertrain type vcan
          sudo ip link add dev vcan-controller type vcan
          sudo ip link set up vcan-powertrain
          sudo ip link set up vcan-controller
      - run: ./scripts/check-linux
