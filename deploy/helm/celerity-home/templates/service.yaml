apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: celerity-home
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: celerity-home
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: grpc
      port: 80
      targetPort: grpc
      protocol: TCP
      appProtocol: kubernetes.io/h2c
