[package]
name = "sync"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
celerity-proto = { path = "../celerity-proto" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
prost = "0.14.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.4"
zip = { version = "7.2.0", default-features = false }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

[dev-dependencies]
control-core = { path = "../control-core" }
tempfile = "3.27.0"

[[bin]]
name = "celerity-sync"
path = "src/main.rs"

[lints]
workspace = true
