[workspace]
members = [
  "crates/control-core",
  "crates/control-protocol",
  "crates/sync",
  "crates/vehicle-diagnostics",
  "crates/vehicle-runtime",
  "crates/vehicle-ui",
  "firmware/duct-controller",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
