apiVersion: v1
kind: Namespace
metadata:
  name: celerity
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: celerity-home
  namespace: celerity
data:
  storage-root: /var/lib/celerity-home
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: celerity-home
  namespace: celerity
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celerity-home
  namespace: celerity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: celerity-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celerity-home
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: home
          image: ghcr.io/kellen-miller/celerity-home:replace-with-release-digest
          imagePullPolicy: IfNotPresent
          env:
            - name: CELERITY_HOME_STORAGE_ROOT
              valueFrom:
                configMapKeyRef:
                  name: celerity-home
                  key: storage-root
            - name: CELERITY_HOME_TOKEN_PATH
              value: /var/run/secrets/celerity/token
            - name: CELERITY_HOME_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: celerity-home-webhook
                  key: url
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: storage, mountPath: /var/lib/celerity-home}
            - {name: token, mountPath: /var/run/secrets/celerity, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: celerity-home
        - name: token
          secret:
            secretName: celerity-home-vehicle-token
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: celerity-home
  namespace: celerity
spec:
  selector:
    app.kubernetes.io/name: celerity-home
  ports:
    - {name: http, port: 80, targetPort: http}
