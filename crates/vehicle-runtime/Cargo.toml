[package]
name = "vehicle-runtime"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
control-core = { path = "../control-core" }
control-protocol = { path = "../control-protocol" }
serde_json = "1.0.151"
vehicle-diagnostics = { path = "../vehicle-diagnostics" }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.5.0"
signal-hook = "0.4.4"
socketcan = { version = "3.6.2", default-features = false }
nix = { version = "0.29.0", features = ["poll", "socket"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "celerity"
path = "src/main.rs"

[lints]
workspace = true
