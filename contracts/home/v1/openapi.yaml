openapi: 3.1.0
info:
  title: Celerity vehicle-to-home API
  version: 1.0.0
security:
  - vehicleToken: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: The process is live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: The process and SQLite store are ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /v1/reconcile:
    post:
      operationId: reconcileVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileRequest" }
      responses:
        "200":
          description: Missing Run digests and desired immutable model digest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileResponse" }
  /v1/runs/{run_digest}/chunks/{chunk_digest}:
    put:
      operationId: putRunChunk
      parameters:
        - { name: run_digest, in: path, required: true, schema: { $ref: "#/components/schemas/Digest" } }
        - { name: chunk_digest, in: path, required: true, schema: { $ref: "#/components/schemas/Digest" } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Exact chunk bytes stored idempotently }
  /v1/runs/{run_digest}/complete:
    post:
      operationId: completeRun
      parameters:
        - { name: run_digest, in: path, required: true, schema: { $ref: "#/components/schemas/Digest" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Exact full Run digest acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompletedRun" }
  /v1/models/{digest}:
    get:
      operationId: getModel
      parameters:
        - { name: digest, in: path, required: true, schema: { $ref: "#/components/schemas/Digest" } }
      responses:
        "200":
          description: Immutable model bundle
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Model is not staged }
  /v1/jobs:
    post:
      operationId: startTrainingJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequest" }
      responses:
        "202":
          description: Durable training job admitted and launched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStarted" }
        "409": { description: One or more input Runs are incomplete }
  /v1/jobs/{job_id}:
    get:
      operationId: getTrainingJob
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Durable training job state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        "404": { description: Job not found }
components:
  securitySchemes:
    vehicleToken:
      type: http
      scheme: bearer
  schemas:
    Digest:
      type: string
      pattern: "^[0-9a-f]{64}$"
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [live, ready] }
    ReconcileRequest:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - completed_run_digests
        - active_model_digest
        - staged_model_digest
        - rejected_model_digests
      properties:
        schema_version: { const: 1 }
        completed_run_digests:
          type: array
          items: { $ref: "#/components/schemas/Digest" }
        active_model_digest:
          oneOf:
            - { $ref: "#/components/schemas/Digest" }
            - { type: "null" }
        staged_model_digest:
          oneOf:
            - { $ref: "#/components/schemas/Digest" }
            - { type: "null" }
        rejected_model_digests:
          type: array
          items: { $ref: "#/components/schemas/Digest" }
    ReconcileResponse:
      type: object
      additionalProperties: false
      required: [missing_run_digests, desired_model_digest]
      properties:
        missing_run_digests:
          type: array
          items: { $ref: "#/components/schemas/Digest" }
        desired_model_digest:
          oneOf:
            - { $ref: "#/components/schemas/Digest" }
            - { type: "null" }
    CompletedRun:
      type: object
      additionalProperties: false
      required: [run_digest]
      properties:
        run_digest: { $ref: "#/components/schemas/Digest" }
    JobRequest:
      type: object
      additionalProperties: false
      required: [run_digests, recipe]
      properties:
        run_digests:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Digest" }
        recipe: { type: string, const: causal-tcn-v1 }
    JobStarted:
      type: object
      additionalProperties: false
      required: [job_id, state]
      properties:
        job_id: { type: string, format: uuid }
        state: { type: string, const: running }
    JobStatus:
      type: object
      additionalProperties: false
      required: [id, state, recipe, input_digests_json, created_at]
      properties:
        id: { type: string, format: uuid }
        state:
          type: string
          enum: [queued, running, completed, no_change, rejected, failed]
        recipe: { type: string }
        input_digests_json: { type: string }
        pid: { type: [integer, "null"] }
        stdout_path: { type: [string, "null"] }
        stderr_path: { type: [string, "null"] }
        artifact_digest:
          oneOf:
            - { $ref: "#/components/schemas/Digest" }
            - { type: "null" }
        terminal_summary: { type: [string, "null"] }
        created_at: { type: string }
