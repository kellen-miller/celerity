[project]
name = "celerity-proto"
version = "0.1.0"
description = "Generated Celerity Protocol Buffer messages"
requires-python = ">=3.14,<3.15"
dependencies = ["protobuf>=7.36.2,<8"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["celerity"]

[tool.ruff]
extend-exclude = ["celerity"]
