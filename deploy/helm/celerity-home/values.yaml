image:
  repository: ghcr.io/kellen-miller/celerity-home
  digest: sha256:replace-with-release-digest
  pullPolicy: IfNotPresent

storageRoot: /var/lib/celerity-home

persistence:
  size: 20Gi
  storageClassName: ""

secrets:
  vehicleToken: celerity-home-vehicle-token
  webhook: celerity-home-webhook

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi
